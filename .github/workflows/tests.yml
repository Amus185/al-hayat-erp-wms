# Tests on every push. Deploys are done by Cloudflare itself (each Worker and
# the Pages project is connected to this repository; see
# docs/DEPLOY_CLOUDFLARE.md "Automatic deploys"), so this workflow never deploys.
#
name: Tests

on:
  push:
    branches: [main, claude/friendly-noether-g968s1]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend typecheck
        run: npm --workspace backend run typecheck
      - name: Backend tests
        run: npm --workspace backend test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Assistant tests
        run: node --import tsx --test ai-agent/tests/*.test.ts
      - name: Staff app typecheck
        run: npm --workspace web run typecheck
      - name: Staff app tests
        run: node --import tsx --test web/src/components/*.test.ts
