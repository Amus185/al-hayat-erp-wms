# Test, migrate and deploy everything to Cloudflare on every push.
#
# Order: tests -> database migration -> backend Worker -> assistant Worker ->
# staff app (Pages). Nothing deploys if a test fails.
#
# Repository settings -> Secrets and variables -> Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN   token for account c3066ec0..., see docs/DEPLOY_CLOUDFLARE.md
#              DATABASE_URL           Layerbase connection string (for db:migrate)
#              AGENT_TOKEN_SECRET     same value as the backend Worker's secret
#   Variables: VITE_AGENT_URL         assistant Worker address (shows the Assistant menu)
#              PAGES_BRANCH           the Pages project's production branch (default: main)
# Without CLOUDFLARE_API_TOKEN the tests still run and the deploy is skipped.
name: Test and deploy

on:
  push:
    branches: [main, claude/friendly-noether-g968s1]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c3066ec07528b261e192b4530cca58bf

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend typecheck
        run: npm --workspace backend run typecheck
      - name: Backend tests
        run: npm --workspace backend test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Assistant tests
        run: node --import tsx --test ai-agent/tests/*.test.ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AGENT_TOKEN_SECRET: ${{ secrets.AGENT_TOKEN_SECRET }}
    steps:
      - name: Deploy configured?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set: skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.ok == 'true'

      - name: Database migration
        if: steps.ready.outputs.ok == 'true' && env.DATABASE_URL != ''
        run: npm --workspace backend run db:migrate

      - name: Backend Worker (al-hayat-api)
        if: steps.ready.outputs.ok == 'true'
        working-directory: backend
        run: npx wrangler deploy

      - name: Assistant Worker (alhayat-ai-agent)
        if: steps.ready.outputs.ok == 'true'
        working-directory: ai-agent
        run: |
          npx wrangler deploy
          if [ -n "$AGENT_TOKEN_SECRET" ]; then
            printf '%s' "$AGENT_TOKEN_SECRET" | npx wrangler secret put AGENT_TOKEN_SECRET
          fi

      - name: Staff app (Pages al-hayat-erp)
        if: steps.ready.outputs.ok == 'true'
        working-directory: web
        env:
          VITE_AGENT_URL: ${{ vars.VITE_AGENT_URL }}
        run: |
          npx vite build
          npx wrangler pages deploy dist --project-name=al-hayat-erp --branch="${{ vars.PAGES_BRANCH || 'main' }}" --commit-dirty=true

      - name: Health check
        if: steps.ready.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://al-hayat-api.biggestfunofpes.workers.dev/api/v1/health; then echo; exit 0; fi
            sleep 5
          done
          echo "Backend health check failed" >&2
          exit 1
