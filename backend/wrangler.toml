name = "al-hayat-api"
main = "src/index.ts"
compatibility_date = "2024-07-01"

[[d1_databases]]
binding = "DB"
database_name = "al-hayat-db"
database_id = "1cae6841-1519-4131-9636-161a5039c3c5"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "al-hayat-files"

[vars]
JWT_ACCESS_EXPIRY = "15m"
JWT_REFRESH_EXPIRY = "7d"

[observability]
enabled = true
head_sampling_rate = 1

